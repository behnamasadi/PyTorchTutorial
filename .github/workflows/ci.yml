name: Tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest  # CPU-only runner; scripts will detect device and fall back to CPU
    permissions:
      contents: write # push coverage badge + report to the python-coverage-comment-action-data branch
      pull-requests: write # coverage comment on PRs from this repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy torch  # PyTorch CPU version; scripts handle device detection
          

      - name: Run tests with coverage
        run: pytest --ignore=projects --cov=utility --cov-report=term --cov-report=xml

      - name: Verify Python scripts (runtime execution check)
        run: |
          python utils/scripts/verify_scripts.py

      - name: Coverage badge and report
        # Default branch: stores badge.svg + HTML report in the
        # python-coverage-comment-action-data branch. PRs: posts a comment.
        if: github.event_name == 'pull_request' || github.ref_name == 'master'
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
